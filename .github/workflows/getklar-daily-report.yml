name: SHEKO Daily Spend Report

on:
  schedule:
    # 6:57 UTC ≈ 8:57 CET / 8:57 CEST → ~9:00 AM German time
    - cron: "57 6 * * *"
  workflow_dispatch: {}

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/pipelines/pyproject.toml

      - name: Install dependencies
        run: PYTHONPATH=packages/pipelines/src pip install packages/pipelines

      - name: Run daily report
        env:
          GETKLAR_API_TOKEN: ${{ secrets.GETKLAR_API_TOKEN }}
          GETKLAR_TEMPLATE_URL: ${{ secrets.GETKLAR_TEMPLATE_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          PYTHONPATH=packages/pipelines/src python -m loaders.getklar_daily_report
